[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["muxiner"]
description = "把照片装进相机取景框：水印、拍摄参数、12 栅格排版"

[workspace.dependencies]
framed-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "tiff",
] }
kamadak-exif = "0.6"
ab_glyph = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# wasm 包体优先，牺牲一点运行速度。
[profile.release.package.framed-wasm]
opt-level = "s"
