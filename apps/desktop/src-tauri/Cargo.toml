
[package]
name = "framed-desktop"
version = "0.3.0"
description = "框影 Framed 桌面应用（Tauri v2）"
edition = "2021"
rust-version = "1.77.2"
publish = false

# 独立 cargo 工程：不并入仓库根 workspace（避免 `cargo test --workspace` 卷入 Tauri）。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
framed-core = { path = "../../../crates/core", package = "framed-core" }
