name: Release

# 推送 v* tag 即可自动构建并发布 GitHub Release：
#   git tag v0.3.0
#   git push origin main
#   git push origin v0.3.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install npm dependencies
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/desktop ci
      - name: Build wasm
        run: ./scripts/build-wasm.sh
      - name: Stamp version from tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Build web dist
        run: npm --prefix apps/web run build
      - name: Build universal dmg
        run: |
          cd apps/desktop
          npm run tauri -- build --target universal-apple-darwin --bundles dmg
      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install npm dependencies
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/desktop ci
      - name: Build wasm
        run: ./scripts/build-wasm.sh
      - name: Stamp version from tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Build web dist
        run: npm --prefix apps/web run build
      - name: Build NSIS installer
        run: |
          cd apps/desktop
          npm run tauri -- build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Framed ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/*
          fail_on_unmatched_files: true
